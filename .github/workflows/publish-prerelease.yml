name: Validate release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    uses: ./.github/workflows/ci.yml

  artifact:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run test:package -- --retain
      - uses: actions/upload-artifact@v4
        with:
          name: codex-agent-bridge-candidate
          path: codex-agent-bridge-*.tgz
          if-no-files-found: error
          retention-days: 14
