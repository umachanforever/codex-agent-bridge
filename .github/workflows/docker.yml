name: Docker smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: docker build -t codex-agent-bridge:dev .
      - run: node scripts/docker-smoke.mjs
