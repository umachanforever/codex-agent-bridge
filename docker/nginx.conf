worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8081;
    client_max_body_size 128m;
    location /admin {
      proxy_pass http://127.0.0.1:8789;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_buffering off;
    }
    location / { return 404; }
  }
  server {
    listen 8080;
    client_max_body_size 128m;
    client_body_timeout 60s;
    location /admin {
      proxy_pass http://127.0.0.1:8789;
      proxy_http_version 1.1;
      # Keep the browser-visible authority for exact same-origin validation.
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_buffering off;
    }
    location / {
      proxy_pass http://127.0.0.1:8787;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8787;
      proxy_set_header Connection "";
      # Preserve Authorization and Origin: the proxy enforces both.
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 21660s;
      proxy_send_timeout 21660s;
      send_timeout 21660s;
    }
  }
}
