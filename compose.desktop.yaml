# Native-service replacement. Private paths and proxy settings live in deploy/local/.env.
services:
  bridge:
    container_name: codex-agent-bridge-api
    image: codex-agent-bridge:local-20260924
    build:
      context: .
      args:
        HTTP_PROXY: ${BRIDGE_PROXY:-}
        HTTPS_PROXY: ${BRIDGE_PROXY:-}
    init: true
    restart: unless-stopped
    environment:
      CODEX_BRIDGE_TOKEN_FILE: /run/secrets/bridge_token
      BRIDGE_MODEL: ${BRIDGE_MODEL:-gpt-6-luna}
      BRIDGE_AUTH_MODE: reuse
      BRIDGE_AUTH_SOURCE: /run/local-codex
      BRIDGE_PROFILE: local
      BRIDGE_REQUEST_TIMEOUT: ${BRIDGE_REQUEST_TIMEOUT:-21600s}
      BRIDGE_BODY_LIMIT: ${BRIDGE_BODY_LIMIT:-134217728}
      BRIDGE_MAX_REQUESTS: ${BRIDGE_MAX_REQUESTS:-10000}
      HTTP_PROXY: ${BRIDGE_PROXY:-}
      HTTPS_PROXY: ${BRIDGE_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1
    secrets:
      - bridge_token
    volumes:
      - ${BRIDGE_RUNTIME_DIR:-./deploy/local/runtime}/codex-home:/data/codex
      - ${BRIDGE_RUNTIME_DIR:-./deploy/local/runtime}/state:/data/state
      - ${BRIDGE_RUNTIME_DIR:-./deploy/local/runtime}/workspace:/workspace
      - ${LOCAL_CODEX_HOME:?Set LOCAL_CODEX_HOME}:/run/local-codex:ro
    ports:
      - "127.0.0.1:${BRIDGE_PORT:-8787}:8080"
      - "127.0.0.1:${BRIDGE_ADMIN_PORT:-8789}:8081"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  gateway:
    container_name: codex-agent-bridge-gateway
    image: nginx:1.28-alpine
    user: "101:101"
    network_mode: service:bridge
    depends_on:
      bridge:
        condition: service_started
    restart: unless-stopped
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
secrets:
  bridge_token:
    file: ./secrets/bridge-token
